name: CI

# M4-E3 三步门（04 §5.7）：typecheck → lint:css → build + 冒烟。
# 注意：本文件随 push 到 GitHub 才激活——仓库当前未 push，CI 有效性在 T17 验收说明。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 三步门 ① 类型检查
        run: npm run typecheck
      - name: 三步门 ② CSS 守护（stylelint）
        run: npm run lint:css
      - name: 冒烟三件（token/对比度/路由快照）
        run: npm run test
      - name: 三步门 ③ 构建
        run: npm run build