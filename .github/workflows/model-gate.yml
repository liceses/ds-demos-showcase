# 项目模型全量门禁（D6 版）——变更集触发粒度 + 豁免逃生门。
#
# 设计（design.md §6.1 / D6）：
#   触发粒度（只查可能改变模型的 PR，非全量无差别扫描）：
#     - 提取/契约/渲染：biz（backend/app|frontend/src 业务代码）或 model（docs/model、tooling）变更
#     - hash 门禁      ：仅 biz 变更（model-only 时代码没动，提取产物确定性等于存储骨架）
#   豁免（仅对 hash 漂移生效，契约违规永不豁免）：
#     - 声明：PR title/body 含 `model-exempt: #<issue>`
#     - 批准：豁免 issue 必须 open 且未超 7 天硬时限（护栏：触碰模型文件 → 豁免无效）
#     - 追踪：issue 即债务清单；过期自动重新 FAIL
# 纯逻辑（变更集分类、豁免裁决）由 tooling/exempt-check.py 承载（本地可测）。

name: model-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装校验依赖
        run: pip install jsonschema

      # ── 变更集分类 ──────────────────────────────────────────────
      - name: 计算变更集（biz / model）
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.event.pull_request.base.ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > /tmp/changed.txt
          else
            git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          fi
          # merge-base 兜底：PR 历史含 merge 时用三路 diff
          git diff --name-only $(git merge-base "$BASE" HEAD 2>/dev/null || echo HEAD)...HEAD 2>/dev/null >> /tmp/changed.txt
          sort -u /tmp/changed.txt -o /tmp/changed.txt
          cat /tmp/changed.txt
          BIZ=$(grep -E '^(backend/app|frontend/src)/.*\.(py|ts|tsx|vue)$' /tmp/changed.txt || true)
          MODEL=$(grep -E '^(docs/model/|tooling/|AGENTS\.md$|\.github/workflows/model-gate\.yml)' /tmp/changed.txt || true)
          echo "biz_changed=$([ -n "$BIZ" ] && echo true || echo false)"
          echo "model_changed=$([ -n "$MODEL" ] && echo true || echo false)"
          echo "biz_changed=$([ -n "$BIZ" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "model_changed=$([ -n "$MODEL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "list=$(tr '\n' ' ' < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"

      # ── 提取（biz 或 model 变更时）──────────────────────────────
      - name: 提取骨架（py + ts → merge）
        if: steps.changed.outputs.biz_changed == 'true' || steps.changed.outputs.model_changed == 'true'
        run: |
          python tooling/extract.py --dst /tmp/be.json backend/app
          node tooling/extract-ts.mjs --src frontend/src --dst /tmp/fe.json
          python tooling/merge.py --py-fragment /tmp/be.json --fe-json /tmp/fe.json \
            --out /tmp/pim.generated.json --hash-out /tmp/pim.generated.hash

      # ── ① hash 门禁（仅 biz 变更；model-only 时产物=存储骨架，确定性一致）──
      - name: ① 骨架 hash 门禁
        id: hash
        if: steps.changed.outputs.biz_changed == 'true'
        run: |
          expected="$(cat docs/model/pim.generated.hash 2>/dev/null || echo '<missing>')"
          actual="$(cat /tmp/pim.generated.hash)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::PIM 骨架与代码漂移: 存储 $expected，当前 $actual。运行 tooling 三件套重算并提交更新。"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "骨架 hash 一致: $actual"
          fi

      # ── 豁免裁决（仅漂移时；契约违规/模型变更永不豁免）─────────
      - name: "豁免裁决（model-exempt: #issue，open 且 7 天内）"
        if: steps.hash.outputs.drifted == 'true'
        env:
          PR_BODY: "${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}"
          CHANGED: ${{ steps.changed.outputs.list }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE=$(echo "$PR_BODY" | grep -o 'model-exempt[[:space:]]*:[[:space:]]*#\?[0-9]\+' | grep -o '[0-9]\+' | head -1 || true)
          if [ -z "$ISSUE" ]; then
            echo "::error::骨架漂移且无豁免声明——运行 tooling 三件套重算并提交更新，或声明 model-exempt: #<issue>"
            exit 1
          fi
          STATE=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE}" | jq -r .state)
          CREATED=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE}" | jq -r .created_at)
          python tooling/exempt-check.py --pr-body "$PR_BODY" --changed "$CHANGED" \
            --issue-state "$STATE" --issue-created-at "$CREATED"

      # ── ② 契约 + 交叉校验（合并骨架在 /tmp 产物，非仓库路径）──
      - name: ② 契约 + 交叉校验
        if: steps.changed.outputs.biz_changed == 'true' || steps.changed.outputs.model_changed == 'true'
        run: |
          python tooling/validate.py \
            --schema docs/model/contract.schema.json \
            /tmp/pim.generated.json \
            docs/model/modules/*.json

      # ── ②b 函数级存在性校验（分层门禁：现场提取 + 引用完整性，不比对 hash）──
      # 函数级 fragment 输入时 merge.py 自动跳过骨架合并，--out 只是必填占位，
      # 必须指向独立 scratch——不能指向 /tmp/pim.generated.json（那是步骤「提取骨架」
      # 的真骨架，也是本步 --functions 校验的参照；覆盖成 0 节点空图会让
      # parent 存在性检查全灭，8d56cd6 事故）。
      - name: ②b 函数级存在性校验
        if: steps.changed.outputs.biz_changed == 'true' || steps.changed.outputs.model_changed == 'true'
        run: |
          python tooling/extract.py --depth function --dst /tmp/fn-be.json backend/app
          node tooling/extract-ts.mjs --src frontend/src --dst /tmp/fn-fe.json --depth function
          python tooling/merge.py --py-fragment /tmp/fn-be.json --fn-fe-json /tmp/fn-fe.json \
            --out /tmp/pim.functions-skeleton-scratch.json --fn-out /tmp/pim.functions.json
          python tooling/validate.py --schema docs/model/contract.schema.json \
            /tmp/pim.generated.json --functions /tmp/pim.functions.json

      # ── ③ 渲染冒烟 ──────────────────────────────────────────────
      - name: ③ 渲染冒烟
        if: steps.changed.outputs.biz_changed == 'true' || steps.changed.outputs.model_changed == 'true'
        run: |
          python tooling/render-mermaid.py \
            /tmp/pim.generated.json docs/model/modules/*.json \
            --frontend-subsystems views \
            --out /tmp/pim.mmd
          echo "渲染成功：$(grep -c '^    .* --' /tmp/pim.mmd) 条边"
