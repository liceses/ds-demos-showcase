services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:///./data/app.db
      STORAGE_DIR: ./storage
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      # 生产全站 HTTPS（HTTPS 终止在 Cloudflare/nginx，回源 http）时设 true：登录 Cookie 才带 Secure 标志
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTO_APPROVE: ${AUTO_APPROVE:-true}
      # 匿名上传信任通道：AI agent 带此 code 上传直接放行（可留空关闭）
      UPLOAD_CODE: ${UPLOAD_CODE:-}
      MAX_UPLOAD_SIZE: 209715200
      MAX_FILE_SIZE: 209715200
      # CORS 允许来源（同源部署不需要；API 挂独立域名/跨源前端时在 .env 设 CORS_ORIGINS）
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # 存储模式总开关：false=只用本地存储，true/留空=按 OSS_* 配置决定
      OSS_ENABLED: ${OSS_ENABLED:-true}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      # 本地服务模式：true=本地服务器下发，OSS 仅作备份/存 log（省 OSS 下行钱，推荐）
      OSS_SERVE_LOCAL: ${OSS_SERVE_LOCAL:-true}
      # 可选：OSS 自定义域名（如 https://oss.deepdemos.top），规避默认域名对 HTML 的强制下载策略
      OSS_CUSTOM_DOMAIN: ${OSS_CUSTOM_DOMAIN:-}
      # 预览入口公开地址：demo 预览 iframe 所用主机（如 http://demo.deepdemos.top）
      PREVIEW_BASE_URL: ${PREVIEW_BASE_URL:-}
      # 网站自身 git 仓库（用于「更新公告」= commit 信息）
      SITE_REPO_DIR: /site-repo
    volumes:
      - demo-data:/app/data
      - demo-storage:/app/storage
      # 只读挂载网站仓库根目录（= compose 文件所在目录，含 .git 与 scripts/）
      - .:/site-repo:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  demo-data:
  demo-storage: