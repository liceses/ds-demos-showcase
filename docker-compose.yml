services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:///./data/app.db
      STORAGE_DIR: ./storage
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      # 生产全站 HTTPS（HTTPS 终止在 Cloudflare/nginx，回源 http）时设 true：登录 Cookie 才带 Secure 标志
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTO_APPROVE: ${AUTO_APPROVE:-true}
      # 匿名上传信任通道：AI agent 带此 code 上传直接放行（可留空关闭）
      UPLOAD_CODE: ${UPLOAD_CODE:-}
      MAX_UPLOAD_SIZE: 209715200
      MAX_FILE_SIZE: 209715200
      # CORS 允许来源（同源部署不需要；API 挂独立域名/跨源前端时在 .env 设 CORS_ORIGINS）
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # 存储模式总开关：false=只用本地存储，true/留空=按 OSS_* 配置决定
      OSS_ENABLED: ${OSS_ENABLED:-true}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      # 本地服务模式：true=本地服务器下发，OSS 仅作备份/存 log（省 OSS 下行钱，推荐）
      OSS_SERVE_LOCAL: ${OSS_SERVE_LOCAL:-true}
      # 可选：OSS 自定义域名（如 https://oss.deepdemos.top），规避默认域名对 HTML 的强制下载策略
      OSS_CUSTOM_DOMAIN: ${OSS_CUSTOM_DOMAIN:-}
      # 预览入口公开地址：demo 预览 iframe 所用主机（如 http://demo.deepdemos.top）
      PREVIEW_BASE_URL: ${PREVIEW_BASE_URL:-}
      # 网站自身 git 仓库（用于「更新公告」= commit 信息）
      SITE_REPO_DIR: /site-repo
      # ── 内存治理（2026-09-02 复盘：容器 RSS 862MiB，其中 ~645MB 是 12 段 30~64MB 的
      #    glibc per-arena heap —— 属"多线程 arena 虚胖"，不是对象泄漏）──
      # glibc 默认 arena 上限 = 8 × CPU 核数，且容器看到的是宿主核数（不是配额）。
      # 每个 arena 各攥一块 heap，彼此不能合并、段顶以下的空闲块永不归还 OS：
      # 上传 / 预览 / OSS 同步轮转过的每条线程都把"自己那一格"撑大 → RSS 只涨不跌，重启才归零。
      # 压到 2 → 全部线程共享一把堆，free 的内存可合并、可被 trim 回收。
      # 代价：malloc 锁竞争略升（当前 CPU ~1%，可忽略）。
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
    # 不给上限 = 一次 200MB 上传（_read_limited 整包读进内存，峰值 400~600MB）
    # 在无 swap 的 2G 机上直接把 backend 送给 OOM killer（表现又是 502）。
    # 有天花板才既能兜住、又能把问题暴露出来，而不是拖死整台机器（含 docker build 自身）。
    mem_limit: 768m
    logging:
      # json-file 驱动默认不轮转；log_requests 每请求一行（预览子资源也算）→ 数 GB 磁盘
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - demo-data:/app/data
      - demo-storage:/app/storage
      # 只读挂载网站仓库根目录（= compose 文件所在目录，含 .git 与 scripts/）
      - .:/site-repo:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    logging:
      # nginx 每个请求一条 access log（预览子资源也算，实测出站 26GB 量级）→ 这是宿主磁盘最大的一块写
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

volumes:
  demo-data:
  demo-storage: