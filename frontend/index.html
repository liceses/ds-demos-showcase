    <meta charset="UTF-8" />

    <!-- FOUC 先行置主题（04 §3.5）：CSS 到达前锁定 data-theme，防闪纸/闪墨（3 行纪律：读持久化→算生效值→落属性） -->
    <script>
      try { var c = localStorage.getItem('dsh_theme') || 'system'; document.documentElement.dataset.theme = c === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper') : c } catch (e) { document.documentElement.dataset.theme = 'paper' }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
