<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover：启用 env(safe-area-inset-bottom)（M2-1 TabBar 安全区，03 §10.2） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="AI 全民制作人 —— AI 模型生成的网页 Demo 作品集" />
    <meta name="ai-agent-guide" content="/api/v1/meta/agent-guide" />
    <link rel="alternate" type="text/markdown" href="/api/v1/meta/agent-guide" title="AI 上传指南" />
    <title>AI 全民制作人</title>
    <!-- FOUC 先行置主题（04 §3.5）：CSS 到达前锁定 data-theme，防闪纸/闪墨（3 行纪律：读持久化→算生效值→落属性） -->
    <script>
      try { var c = localStorage.getItem('dsh_theme') || 'system'; document.documentElement.dataset.theme = c === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper') : c } catch (e) { document.documentElement.dataset.theme = 'paper' }
    </script>
    <!-- 字体自托管（04 §2.4 F1 @fontsource，T18/M4-E4）：Google Fonts 三行移除，woff2 随 /assets 1y immutable 缓存；preload 标题用 Inter variable -->
    <!-- preload 在 main.ts 运行时注入（vite 对 index.html 的 node_modules 相对 href 不改写——静态 link 会指向死路径） -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
