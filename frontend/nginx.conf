server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    # gzip 压缩（JS/CSS/JSON 通常能压 60-70%）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/xml+rss;

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # 大响应（zip 下载等）直接流式转发，避免落临时文件占磁盘 IO
        proxy_buffering off;
    }

    # Demo 文件预览
    location /preview/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 媒体文件（封面等）
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Vite 构建产物带内容 hash：永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 预览专用子域：demo.deepdemos.top
# 与主站不同源 → iframe 可安全开 allow-same-origin（localStorage 可用）；
# HTML 由后端 /preview 返回（不走 OSS 默认域名），规避阿里云对 HTML 的强制下载。
server {
    listen 80;
    server_name demo.deepdemos.top;

    # 仅开放预览与媒体，其余一律 404（避免被当成主站 SPA/接口）
    location /preview/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location / {
        return 404;
    }
}

# astra 橱窗（astrademos.top）：同一份前端构建 + 同一后端，视区由后端按 Host 头判定
# （services/scope.py：白名单 API + 策展池过滤；此处只管转发与 SEO 屏蔽）。
# SPA 入口照常回退 index.html——main.ts 运行时按 hostname 加载橱窗皮。
server {
    listen 80;
    server_name astrademos.top www.astrademos.top;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 橱窗不做 SEO：禁一切爬虫（防策展池被当主站镜像索引 / 顺藤摸出全库）
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 同源服务预览与媒体（ASTRA_PREVIEW_BASE_URL 留空时的默认拓扑；Host 原样透传给后端做视区判定）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /preview/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退（橱窗皮由 main.ts 按 hostname 分叉）
    location / {
        try_files $uri $uri/ /index.html;
    }
}