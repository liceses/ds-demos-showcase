name = "ds-demos-showcase"
main = "worker/index.ts"
compatibility_date = "2026-08-18"

# 前端构建产物作为静态资源（SPA 回退到 index.html）
assets = { directory = "./dist", not_found_handling = "single-page-application" }

# 数据库（先 npx wrangler d1 create ds-demos，再把 id 填进来）
[[d1_databases]]
binding = "DB"
database_name = "ds-demos"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# 阿里云 OSS 配置（不用 Cloudflare R2，不需要信用卡）
# 把下面三个改成你自己的；AccessKey Secret 用命令行设置：
#   npx wrangler secret put OSS_ACCESS_KEY_SECRET
[vars]
OSS_ENDPOINT = "oss-cn-hangzhou.aliyuncs.com"
OSS_BUCKET = "your-bucket-name"
OSS_ACCESS_KEY_ID = "your-access-key-id"
